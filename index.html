<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Image Manager</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00adb5;
            --text-color: #eeeeee;
            --border-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--primary-color); }
        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            margin-right: 10px;
        }
        
        /* View States */
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Upload Panel */
        .upload-card {
            background-color: var(--surface-color);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
        }
        .file-input { display: none; }
        .upload-label {
            cursor: pointer;
            color: var(--primary-color);
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.2s; }
        .result-box {
            background: #111;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: left;
            display: none;
        }
        .result-box label { font-size: 12px; color: #888; font-weight: bold; display: block; margin-top: 10px; }
        .result-box input {
            width: 100%;
            background: #222;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 4px;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .image-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .img-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #151515;
            border-bottom: 1px solid var(--border-color);
        }
        .card-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .img-name { font-weight: bold; font-size: 14px; margin-bottom: 12px; word-break: break-all; }
        .input-group { margin-bottom: 10px; }
        .input-group label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .input-group div { display: flex; }
        .input-group input {
            flex-grow: 1;
            background: #111;
            border: 1px solid var(--border-color);
            color: #ccc;
            padding: 6px;
            font-size: 12px;
            border-radius: 4px 0 0 4px;
        }
        .copy-btn {
            background: #333;
            border: 1px solid var(--border-color);
            border-left: none;
            padding: 0 10px;
            font-size: 11px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        .copy-btn:hover { background: #444; }
        
        .no-images { text-align: center; color: #666; padding: 40px; grid-column: 1/-1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="repo-title">WebP Image Manager</h1>
        <div>
            <button id="download-sheet-btn" class="secondary">⬇️ Download Sheet</button>
            <button id="action-btn">➕ Upload Image</button>
        </div>
    </header>

    <div id="gallery-panel" class="view-panel active">
        <div class="gallery-grid" id="gallery-grid">
            <div class="no-images">Loading images from your GitHub repository...</div>
        </div>
    </div>

    <div id="upload-panel" class="view-panel">
        <div class="upload-card">
            <label for="file-picker" class="upload-label">Click here to choose a JPG or PNG image</label>
            <input type="file" id="file-picker" class="file-input" accept="image/png, image/jpeg, image/jpg">
            <div id="selected-file-name" style="color: #888;"></div>
            
            <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            
            <div class="result-box" id="result-box">
                <p style="color: #4caf50; margin-top:0; font-weight:bold;">✓ Upload Complete!</p>
                <p style="font-size:12px; color:#aaa; margin-bottom:15px;">GitHub automation is now creating your .webp copy. It will appear in the gallery in ~30 seconds.</p>
                
                <label>Direct WebP Public Link:</label>
                <input type="text" id="res-link" readonly>
                
                <label>HTML Source Code:</label>
                <input type="text" id="res-src" readonly>
            </div>
            
            <div style="margin-top: 30px;">
                <button id="upload-more-btn" style="display:none;">🔄 Upload More</button>
                <button id="exit-btn" class="secondary">🚪 Exit / View Gallery</button>
            </div>
        </div>
    </div>
</div>

<script>
    // CONFIGURATION
    const GITHUB_TOKEN = "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"; 
    const REPO_OWNER = "ANTICRUCIFIED";
    const REPO_NAME = "MyWebP_Images";
    const BRANCH = "main";
    
    // BASE URL FORMULA
    const BASE_CDN_URL = `https://${REPO_OWNER.toLowerCase()}.github.io/${REPO_NAME}/images/`;

    // DOM ELEMENTS
    const galleryPanel = document.getElementById('gallery-panel');
    const uploadPanel = document.getElementById('upload-panel');
    const actionBtn = document.getElementById('action-btn');
    const exitBtn = document.getElementById('exit-btn');
    const uploadMoreBtn = document.getElementById('upload-more-btn');
    const downloadSheetBtn = document.getElementById('download-sheet-btn');
    const filePicker = document.getElementById('file-picker');
    const galleryGrid = document.getElementById('gallery-grid');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const resultBox = document.getElementById('result-box');
    const selectedFileName = document.getElementById('selected-file-name');

    let allImages = [];

    // VIEW ROUTING CONTROLS
    actionBtn.addEventListener('click', () => {
        if(galleryPanel.classList.contains('active')) {
            switchView('upload');
        } else {
            handleUpload();
        }
    });

    exitBtn.addEventListener('click', () => {
        switchView('gallery');
        loadGallery();
    });

    uploadMoreBtn.addEventListener('click', resetUploadForm);

    function switchView(view) {
        if(view === 'upload') {
            galleryPanel.classList.remove('active');
            uploadPanel.classList.add('active');
            actionBtn.innerText = "🚀 Confirm Upload";
            resetUploadForm();
        } else {
            uploadPanel.classList.remove('active');
            galleryPanel.classList.add('active');
            actionBtn.innerText = "➕ Upload Image";
        }
    }

    function resetUploadForm() {
        filePicker.value = "";
        selectedFileName.innerText = "";
        progressBar.style.display = 'none';
        progressFill.style.width = '0%';
        resultBox.style.display = 'none';
        uploadMoreBtn.style.display = 'none';
        actionBtn.style.display = 'inline-block';
    }

    filePicker.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            selectedFileName.innerText = `Selected: ${e.target.files[0].name}`;
        }
    });

    // UPLOAD EXECUTION TO GITHUB API
    async function handleUpload() {
        const file = filePicker.files[0];
        if (!file) {
            alert("Please pick an image file first.");
            return;
        }

        actionBtn.style.display = 'none';
        progressBar.style.display = 'block';
        progressFill.style.width = '50%';

        // Sanitize filename to prevent directory escaping
        const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const uploadPath = `images/${safeName}`;

        // Convert file to Base64 required by GitHub API
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const base64Content = reader.result.split(',')[1];
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${uploadPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload raw image: ${safeName}`,
                        content: base64Content,
                        branch: BRANCH
                    })
                });

                if(response.ok) {
                    progressFill.style.width = '100%';
                    // Generate projected outputs
                    const nameWithoutExtension = safeName.substring(0, safeName.lastIndexOf('.'));
                    const projectedWebPUrl = `${BASE_CDN_URL}${nameWithoutExtension}.webp`;
                    const projectedHtml = `<img src="${projectedWebPUrl}" alt="${nameWithoutExtension}">`;
                    
                    document.getElementById('res-link').value = projectedWebPUrl;
                    document.getElementById('res-src').value = projectedHtml;
                    resultBox.style.display = 'block';
                    uploadMoreBtn.style.display = 'inline-block';
                } else {
                    const errData = await response.json();
                    alert(`Upload failed: ${errData.message}`);
                    actionBtn.style.display = 'inline-block';
                }
            } catch (error) {
                alert("Network error occurred during execution.");
                actionBtn.style.display = 'inline-block';
            }
        };
    }

    // LOAD AND RENDER IMAGES FROM GITHUB
    async function loadGallery() {
        try {
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if(!response.ok) throw new Error("Could not fetch repo directory listing.");
            
            const files = await response.json();
            // Filter strictly for compiled webp images
            allImages = files.filter(f => f.name.toLowerCase().endsWith('.webp'));
            
            if(allImages.length === 0) {
                galleryGrid.innerHTML = `<div class="no-images">No .webp files generated yet. Upload an image to start!</div>`;
                return;
            }
            
            galleryGrid.innerHTML = "";
            allImages.forEach((img, index) => {
                const imgUrl = `${BASE_CDN_URL}${img.name}`;
                const nameWithoutExt = img.name.split('.')[0];
                const htmlSrc = `<img src="${imgUrl}" alt="${nameWithoutExt}">`;
                
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img class="img-preview" src="${imgUrl}" alt="${nameWithoutExt}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\' viewBox=\\'0 0 100 100\\'><text y=\\'50%\\' x=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'%23666\\'>Processing...</text></svg>'">
                    <div class="card-details">
                        <div class="img-name">${img.name}</div>
                        <div class="input-group">
                            <label>Public Link</label>
                            <div>
                                <input type="text" id="link-${index}" value="${imgUrl}" readonly>
                                <button class="copy-btn" onclick="copyText('link-${index}')">Copy</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>HTML Source</label>
                            <div>
                                <input type="text" id="html-${index}" value="${htmlSrc.replace(/"/g, '&quot;')}" readonly>
                                <button class="copy-btn" onclick="copyText('html-${index}')">Copy</button>
                            </div>
                        </div>
                    </div>
                `;
                galleryGrid.appendChild(card);
            });
        } catch (e) {
            galleryGrid.innerHTML = `<div class="no-images">Error fetching elements. Check your API settings.</div>`;
        }
    }

    // HELPER UI UTILITIES
    window.copyText = function(id) {
        const input = document.getElementById(id);
        input.select();
        document.execCommand('copy');
        alert("Copied to clipboard!");
    }

    // DOWNLOAD TSV/CSV DATA SHEET
    downloadSheetBtn.addEventListener('click', () => {
        if(allImages.length === 0) {
            alert("No processed assets to export yet.");
            return;
        }
        let csvContent = "Image Name,Public Link,HTML Image Source\n";
        allImages.forEach(img => {
            const imgUrl = `${BASE_CDN_URL}${img.name}`;
            const htmlSrc = `<img src="${imgUrl}" alt="${img.name.split('.')[0]}">`;
            const line = `"${img.name}","${imgUrl}","${htmlSrc.replace(/"/g, '""')}"`;
            csvContent += line + "\n";
        });
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "webp_images_inventory.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // Run layout pull on initial browser mount
    loadGallery();
</script>
</body>
</html>
